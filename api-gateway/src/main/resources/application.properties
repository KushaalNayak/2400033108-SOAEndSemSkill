
spring.application.name=api-gateway
server.port=8090

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Gateway Route
spring.cloud.gateway.server.webmvc.routes[0].id=driver-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://driver-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/driver
